name: gitleaks

on:
  push:
  pull_request:

# On a pull_request event the action lists the PR's commits to decide what to
# scan, which the default read-only token can't do — the job died on a 403
# while the identical push-event run passed.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
